name: Build site data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_data.py"
      - ".github/workflows/build-data.yml"
  schedule:
    # Refresh from EPA on the 1st of each month.
    - cron: "17 9 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vendor Leaflet (so the page has no CDN dependency)
        run: |
          mkdir -p web/vendor/images
          base=https://unpkg.com/leaflet@1.9.4/dist
          curl -fsSL "$base/leaflet.js"  -o web/vendor/leaflet.js
          curl -fsSL "$base/leaflet.css" -o web/vendor/leaflet.css
          for img in marker-icon.png marker-icon-2x.png marker-shadow.png layers.png layers-2x.png; do
            curl -fsSL "$base/images/$img" -o "web/vendor/images/$img"
          done
          ls -la web/vendor web/vendor/images

      - name: Fetch EPA + Census data
        run: python scripts/fetch_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data web/vendor data-report.txt
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh Houston DMA site data from EPA"
            git push
          fi
