name: Probe TCEQ catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_tceq.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/probe_tceq.py
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tceq-probe.txt
          git diff --staged --quiet || (git commit -m "TCEQ catalog probe output" && git push)
