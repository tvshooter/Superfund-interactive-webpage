name: Probe data sources

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_sources.py"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe EPA + Census endpoints
        run: python scripts/probe_sources.py
